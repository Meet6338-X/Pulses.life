<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>City Health Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0df220",
                        "background-light": "#f5f8f6",
                        "background-dark": "#102211",
                        "emergency-red": "#ff3b30",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body { font-family: 'Public Sans', sans-serif; }
        .ios-tab-shadow { box-shadow: 0 -1px 10px rgba(0,0,0,0.05); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-[#0d1c0e] font-display min-h-screen pb-24">
<!-- Top Navigation Bar -->
<header class="sticky top-0 z-50 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md px-4 pt-8 pb-4 flex items-center justify-between border-b border-[#cee8d1]/30">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1">location_on</span>
<h1 class="text-xl font-bold tracking-tight">Pune</h1>
</div>
<div class="flex items-center gap-3">
<button class="p-2 rounded-full hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-[#0d1c0e] dark:text-white">notifications</span>
</button>
<button class="flex items-center gap-1.5 bg-emergency-red/10 px-3 py-1.5 rounded-full">
<span class="material-symbols-outlined text-emergency-red font-bold" style="font-variation-settings: 'wght' 700">emergency</span>
<span class="text-emergency-red text-xs font-bold uppercase tracking-wider">SOS</span>
</button>
</div>
</header>
<main class="max-w-md mx-auto">
<!-- Primary Health Status Card -->
<section class="p-4">
<div class="relative overflow-hidden rounded-xl bg-white dark:bg-[#1a2e1b] border border-[#cee8d1] shadow-sm p-5">
<div class="flex justify-between items-start mb-6">
<div>
<p class="text-xs font-semibold text-primary/80 uppercase tracking-widest mb-1">Ward Status</p>
<h2 class="text-2xl font-bold">Shivajinagar</h2>
</div>
<div class="bg-primary/20 p-2 rounded-lg">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'wght' 500">health_and_safety</span>
</div>
</div>
<div class="flex items-center gap-4">
<div class="relative size-16">
<svg class="size-full" viewbox="0 0 36 36">
<path class="text-[#cee8d1]/30" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3"></path>
<path class="text-primary" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-dasharray="85, 100" stroke-linecap="round" stroke-width="3"></path>
</svg>
<div class="absolute inset-0 flex items-center justify-center">
<span class="text-xs font-bold">85%</span>
</div>
</div>
<div>
<p class="text-lg font-bold leading-none text-primary">Low Health Risk</p>
<p class="text-sm text-[#499c50] mt-1">Normal system activity reported.</p>
</div>
</div>
<!-- Abstract decorative background element -->
<div class="absolute -right-8 -bottom-8 size-32 bg-primary/5 rounded-full blur-3xl"></div>
</div>
</section>
<!-- Quick Actions Grid (2x3) -->
<section class="px-4 pb-4">
<h3 class="text-sm font-bold text-[#499c50] mb-3 px-1 uppercase tracking-wider">Quick Actions</h3>
<div class="grid grid-cols-2 gap-3">
<!-- Report Symptoms -->
<button class="flex flex-col items-center justify-center p-4 bg-white dark:bg-[#1a2e1b] rounded-xl border border-[#cee8d1] hover:bg-primary/5 transition-colors group">
<div class="size-12 rounded-full bg-primary/10 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary">thermometer</span>
</div>
<span class="text-sm font-bold">Report Symptoms</span>
</button>
<!-- Book Ambulance (Emergency themed) -->
<button class="flex flex-col items-center justify-center p-4 bg-emergency-red/5 dark:bg-emergency-red/10 rounded-xl border border-emergency-red/20 hover:bg-emergency-red/10 transition-colors group">
<div class="size-12 rounded-full bg-emergency-red/10 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-emergency-red">ambulance</span>
</div>
<span class="text-sm font-bold text-emergency-red">Book Ambulance</span>
</button>
<!-- Health Habits -->
<button class="flex flex-col items-center justify-center p-4 bg-white dark:bg-[#1a2e1b] rounded-xl border border-[#cee8d1] hover:bg-primary/5 transition-colors group">
<div class="size-12 rounded-full bg-primary/10 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary">exercise</span>
</div>
<span class="text-sm font-bold">Health Habits</span>
</button>
<!-- Govt Schemes -->
<button class="flex flex-col items-center justify-center p-4 bg-white dark:bg-[#1a2e1b] rounded-xl border border-[#cee8d1] hover:bg-primary/5 transition-colors group">
<div class="size-12 rounded-full bg-primary/10 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary">gavel</span>
</div>
<span class="text-sm font-bold">Govt Schemes</span>
</button>
<!-- Alerts -->
<button class="flex flex-col items-center justify-center p-4 bg-white dark:bg-[#1a2e1b] rounded-xl border border-[#cee8d1] hover:bg-primary/5 transition-colors group relative">
<div class="absolute top-3 right-3 size-2 bg-emergency-red rounded-full"></div>
<div class="size-12 rounded-full bg-primary/10 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary">notifications_active</span>
</div>
<span class="text-sm font-bold">Alerts</span>
</button>
<!-- Insights -->
<button class="flex flex-col items-center justify-center p-4 bg-white dark:bg-[#1a2e1b] rounded-xl border border-[#cee8d1] hover:bg-primary/5 transition-colors group">
<div class="size-12 rounded-full bg-primary/10 flex items-center justify-center mb-2 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined text-primary">analytics</span>
</div>
<span class="text-sm font-bold">Insights</span>
</button>
</div>
</section>
<!-- Environmental Risk Card -->
<section class="p-4">
<div class="rounded-xl bg-[#0d1c0e] text-white p-5 shadow-lg relative overflow-hidden">
<div class="flex justify-between items-center mb-4">
<h3 class="text-lg font-bold">Environmental Risk</h3>
<span class="material-symbols-outlined text-primary">air</span>
</div>
<div class="flex items-center gap-6">
<div class="flex-1">
<p class="text-3xl font-bold mb-1">85 <span class="text-sm font-normal text-white/60">AQI</span></p>
<div class="inline-block px-2 py-0.5 rounded bg-amber-500 text-[10px] font-bold uppercase mb-4">Moderate</div>
<div class="flex items-start gap-2 text-emergency-red bg-emergency-red/20 p-2 rounded-lg border border-emergency-red/30">
<span class="material-symbols-outlined text-sm">warning</span>
<div>
<p class="text-xs font-bold leading-tight uppercase">Heat Alert</p>
<p class="text-[10px] opacity-90 mt-0.5 leading-tight">Stay hydrated. UV index is high today.</p>
</div>
</div>
</div>
<div class="size-20 rounded-lg overflow-hidden flex-shrink-0">
<img class="size-full object-cover" data-alt="Real-time environmental heatmap visualization" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_BYgegJtwh8gDNWJkJDDZ_ovfozi9YGrjnl6qKKwgxqjjn_uIAtXIT3x9Su6tpOXBNDvMkP1uz6urENprpwFILblO-Jx-q37ssuIasNtUmS8wICoEWfdwCdqnS05LIQgHg_qe_-TXaYnOTdN76wA9fYSYickoxcyNajs9hhQqsbVkFn_IomRMPIHEAO25HlZzjUav07fmJ5vLsILzslM3DrX-_JRC1NgQu_nF-GyI8PR1XWkwxuWR15XQRj3tLy3NVR1gfgyU_o4"/>
</div>
</div>
<!-- Background pattern -->
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle at 2px 2px, #0df220 1px, transparent 0); background-size: 24px 24px;"></div>
</div>
</section>
</main>
<!-- Bottom Navigation Bar (iOS Style) -->
<nav class="fixed bottom-0 left-0 right-0 bg-white/95 dark:bg-background-dark/95 backdrop-blur-xl border-t border-[#cee8d1]/30 ios-tab-shadow px-6 pt-3 pb-8 flex items-center justify-between">
<button class="flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-primary transition-all scale-110" style="font-variation-settings: 'FILL' 1">home</span>
<span class="text-[10px] font-bold text-primary">Home</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-gray-400 group-hover:text-primary transition-colors">description</span>
<span class="text-[10px] font-medium text-gray-400 group-hover:text-primary">Reports</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-gray-400 group-hover:text-primary transition-colors">map</span>
<span class="text-[10px] font-medium text-gray-400 group-hover:text-primary">Map</span>
</button>
<button class="flex flex-col items-center gap-1 group">
<span class="material-symbols-outlined text-gray-400 group-hover:text-primary transition-colors">person</span>
<span class="text-[10px] font-medium text-gray-400 group-hover:text-primary">Profile</span>
</button>
</nav>
</body></html>
