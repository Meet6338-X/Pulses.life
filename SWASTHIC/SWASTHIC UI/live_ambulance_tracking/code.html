<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Live Ambulance Tracking</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0df220",
                        "background-light": "#f5f8f6",
                        "background-dark": "#102211",
                        "emergency": "#ff3b30",
                        "route": "#007aff"
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#0d1c0e] overflow-hidden">
<!-- Main Container (iOS Phone Simulation) -->
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-hidden">
<!-- Top App Bar / Status -->
<div class="absolute top-0 left-0 right-0 z-30 bg-background-light/90 dark:bg-background-dark/90 ios-blur px-4 pt-12 pb-4 border-b border-[#0d1c0e]/10">
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<button class="flex size-10 items-center justify-center rounded-full hover:bg-[#0d1c0e]/5">
<span class="material-symbols-outlined text-[#0d1c0e]">arrow_back_ios_new</span>
</button>
<div>
<h2 class="text-[#0d1c0e] text-lg font-bold leading-tight tracking-[-0.015em]">Ambulance on the way</h2>
<p class="text-[#0d1c0e]/60 text-xs font-medium uppercase tracking-wider">SAMVED-VAKR Dispatch</p>
</div>
</div>
<div class="flex items-center gap-2">
<button class="flex size-10 items-center justify-center rounded-full bg-primary/20 text-[#0d1c0e]">
<span class="material-symbols-outlined">info</span>
</button>
</div>
</div>
</div>
<!-- Map Layer (Full Screen) -->
<div class="relative flex-1 bg-[#e5e5e5] dark:bg-[#1a1a1a]">
<!-- Placeholder Map Background -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="Map of Bangalore city with traffic and street details" data-location="Bangalore, India" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuA7Gul9FBU2qw6Zt4V96lv2WGtZjOKpKfftbK_wxxLcNrPXimDGA6cOMgJZREMEx8BKi3CoCBlAz60taxxv7nfLFm5fYvxuP1nIgpXf31TiZ9jt7vGdiGeWq6dAeGGmsVhUZl4p2KnVXzvOCE71G59HHS8pDfqODpuF51S_-bEViIkpeasyr4TlIFh3xWjsuURKRsc4Td7OKOZocydXtzBeXLfbqeo2Liph3jHXeKYk-_aFxaz4y1N1-gjFalq9hHTN-1n1E9uLYqU");'>
<!-- SVG Route Line (Simulated) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" viewbox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
<path d="M100 600 L150 500 L250 450 L280 300" fill="transparent" stroke="#007aff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6"></path>
<!-- User Location Pin -->
<circle cx="100" cy="600" fill="#007aff" r="12" stroke="white" stroke-width="3"></circle>
<circle cx="100" cy="600" fill="#007aff" fill-opacity="0.15" r="30">
<animate attributename="r" dur="2s" from="12" repeatcount="indefinite" to="40"></animate>
<animate attributename="opacity" dur="2s" from="0.5" repeatcount="indefinite" to="0"></animate>
</circle>
</svg>
<!-- Ambulance Marker -->
<div class="absolute top-[300px] left-[280px] -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="bg-emergency p-2 rounded-lg shadow-lg text-white">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">emergency</span>
</div>
<div class="w-2 h-2 bg-emergency rounded-full mt-1 border border-white shadow-sm"></div>
</div>
<!-- User Pin Label -->
<div class="absolute top-[620px] left-[100px] -translate-x-1/2 bg-white px-3 py-1 rounded-full shadow-md border border-gray-200">
<p class="text-[10px] font-bold text-[#007aff] uppercase">My Location</p>
</div>
</div>
<!-- Floating Elements on Map -->
<!-- ETA Card -->
<div class="absolute top-32 left-1/2 -translate-x-1/2 z-20 w-[90%] max-w-sm">
<div class="bg-white/95 dark:bg-background-dark/95 ios-blur p-4 rounded-xl shadow-xl flex items-center justify-between border border-[#0d1c0e]/5">
<div class="flex items-center gap-4">
<div class="bg-primary/10 p-2 rounded-lg">
<span class="material-symbols-outlined text-[#0d1c0e]">timer</span>
</div>
<div>
<p class="text-[#0d1c0e]/60 text-xs font-semibold">ESTIMATED ARRIVAL</p>
<h3 class="text-[#0d1c0e] text-xl font-bold">7 min 30 sec</h3>
</div>
</div>
<div class="text-right">
<p class="text-[#0d1c0e]/60 text-[10px] font-bold uppercase tracking-tighter">Traffic: Moderate</p>
<div class="flex gap-0.5 justify-end mt-1">
<div class="w-3 h-1 bg-primary rounded-full"></div>
<div class="w-3 h-1 bg-primary rounded-full"></div>
<div class="w-3 h-1 bg-gray-300 rounded-full"></div>
</div>
</div>
</div>
</div>
<!-- SOS Button (Floating) -->
<div class="absolute right-4 top-1/2 -translate-y-1/2 z-20">
<button class="flex size-16 items-center justify-center rounded-full bg-emergency shadow-2xl text-white group active:scale-95 transition-transform">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-3xl font-bold">sos</span>
<span class="text-[8px] font-bold tracking-widest mt-0.5">ALARM</span>
</div>
</button>
</div>
<!-- Zoom Controls -->
<div class="absolute right-4 bottom-72 z-20 flex flex-col gap-2">
<button class="flex size-12 items-center justify-center rounded-xl bg-white dark:bg-background-dark shadow-lg">
<span class="material-symbols-outlined">add</span>
</button>
<button class="flex size-12 items-center justify-center rounded-xl bg-white dark:bg-background-dark shadow-lg">
<span class="material-symbols-outlined">remove</span>
</button>
<button class="flex size-12 items-center justify-center rounded-xl bg-white dark:bg-background-dark shadow-lg">
<span class="material-symbols-outlined">my_location</span>
</button>
</div>
</div>
<!-- Bottom Sheet (iOS Style) -->
<div class="relative z-30 bg-background-light dark:bg-background-dark rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.1)] border-t border-[#0d1c0e]/5">
<!-- Drag Handle -->
<div class="flex justify-center py-3">
<div class="h-1.5 w-12 rounded-full bg-[#0d1c0e]/10"></div>
</div>
<div class="px-6 pb-10">
<div class="flex items-center justify-between mb-6">
<div class="flex items-center gap-4">
<div class="relative">
<img alt="Driver profile photo" class="size-14 rounded-full object-cover border-2 border-primary/20" data-alt="Portrait of a male ambulance driver named Rajesh" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAWcpQCJJRNzOXuc7Q4DUUoCT4vdN8qcb5GfUSR4_Kp37U-Q_xOHLTbvw6VDe9M3qCG2gzeyZ0SYIivudjxlSdue2DxjIqR-YjRysAYai9oRzrF1LVeo8oyT5Aj1X0klg8jWo6Lqs9J7ae65ysZ_SPbwiQd9zzabezL5lHgRpFpmIyj6uMWMakqYZDc_XKgUJ1I7VTWbTqJmzZThk6wWg152iS3_Qmb3qjKbRIrnRF6f0wui3OPr4yTn-ZqLQ-VOiAq_KphPGwK7cw"/>
<div class="absolute -bottom-1 -right-1 bg-primary size-5 rounded-full border-2 border-white flex items-center justify-center">
<span class="material-symbols-outlined text-[12px] text-white font-bold">verified</span>
</div>
</div>
<div>
<h4 class="text-[#0d1c0e] text-lg font-bold leading-tight">Rajesh Kumar</h4>
<div class="flex items-center gap-2">
<span class="text-[#0d1c0e]/60 text-sm">Vehicle ID: KA-01-EF-1234</span>
<span class="bg-gray-100 dark:bg-white/10 px-1.5 py-0.5 rounded text-[10px] font-bold text-gray-500">BLS</span>
</div>
</div>
</div>
<div class="text-right">
<div class="flex items-center gap-1 text-[#0d1c0e] font-bold">
<span class="material-symbols-outlined text-primary text-lg">star</span>
<span>4.9</span>
</div>
<p class="text-[#0d1c0e]/40 text-xs">500+ saves</p>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-4">
<button class="flex-1 h-14 bg-primary text-[#102211] rounded-xl font-bold flex items-center justify-center gap-2 active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1">call</span>
                        Call Driver
                    </button>
<button class="size-14 bg-gray-100 dark:bg-white/10 rounded-xl flex items-center justify-center text-[#0d1c0e] active:scale-95 transition-transform">
<span class="material-symbols-outlined">chat_bubble</span>
</button>
</div>
<!-- Secondary Info -->
<div class="mt-6 flex items-center justify-between bg-primary/5 p-4 rounded-xl border border-primary/10">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-[#0d1c0e]/60">medical_services</span>
<p class="text-sm text-[#0d1c0e]/80">Oxygen &amp; Defibrillator on board</p>
</div>
<span class="material-symbols-outlined text-[#0d1c0e]/40">chevron_right</span>
</div>
<!-- Cancel Option -->
<button class="w-full mt-6 text-emergency/60 text-sm font-semibold hover:text-emergency transition-colors">
                    Cancel Request
                </button>
</div>
</div>
<!-- iOS Bottom Indicator -->
<div class="bg-background-light dark:bg-background-dark pb-2 flex justify-center">
<div class="h-1.5 w-32 rounded-full bg-[#0d1c0e]/20"></div>
</div>
</div>
</body></html>
